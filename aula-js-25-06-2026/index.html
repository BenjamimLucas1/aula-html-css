<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Filmes Favoritos</title>
</head>

<body>
    <main>
        <div class="container">
            <h2>Cadastrar Novo Filme</h2>
            <form id="filmeForm">
                <div class="form-group">
                    <label for="nomeFilme">Nome do Filme :</label>
                    <input type="text" id="nomeFilme" placeholder="Ex: Homem-Aranha">
                </div>
                <div class="form-group">
                    <label for="genero">Gênero :</label>
                    <select name="genero" id="genero">
                        <option value="">Selecione ...</option>
                        <option value="acao">Ação</option>
                        <option value="comedia">Comédia</option>
                        <option value="drama">Drama</option>
                        <option value="drama">Terror</option>
                        <option value="ficcao_cientifica">Ficção Científica</option>
                        <option value="romance">Romance</option>
                        <option value="suspense">Suspense</option>
                        <option value="documentario">Documentário</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ano">Ano de Lançamento :</label>
                    <input type="number" id="ano" placeholder="Ex: 2026">
                </div>
                <button type="submit" class="btn-submit">Cadastrar Filme</button>
                <button id="tema">Alternar Tema</button>
            </form>
        </div>
        <div id="listaFilmes"></div>
    </main>
    <script src="/js/script.js"></script>
</body>

</html>
